name: Bug report
description: Report something that is not working correctly
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
      placeholder: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can someone else trigger this?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
    validations:
      required: true

  - type: dropdown
    id: backend
    attributes:
      label: Backend mode
      options:
        - Supabase
        - Local (Bun + SQLite)
        - Demo
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: "e.g. Chrome 126 on macOS 15, Safari on iOS 18"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in the footer (e.g. v1.016)
      placeholder: "v1.016"

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, paste screenshots or screen recordings.

  - type: textarea
    id: logs
    attributes:
      label: Console errors
      description: Open browser DevTools (F12) > Console tab and paste any errors.
      render: shell
