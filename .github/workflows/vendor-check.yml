name: vendor-check

on:
  schedule:
    - cron: '0 8 * * 1' # Mondays 08:00 UTC
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - name: Check for new vendor versions
        id: check
        run: |
          set -e
          LATEST_THREE=$(curl -s https://data.jsdelivr.com/v1/package/npm/three | python3 -c "import sys,json; print(json.load(sys.stdin)['tags']['latest'])")
          echo "latest_three=$LATEST_THREE" >> $GITHUB_OUTPUT

          # Read current pinned version from index.html comment
          CURRENT_THREE=$(grep -oP 'three @\K[0-9.]+' index.html || echo "0")
          echo "Current: three $CURRENT_THREE"
          echo "Latest: three $LATEST_THREE"

      - name: Update vendor files
        run: |
          chmod +x scripts/update-vendor.sh
          ./scripts/update-vendor.sh ${{ steps.check.outputs.latest_three }}
          # verify files exist
          ls -lh vendor/three/build/three.module.js
          # run tests (non-critical, but catch breaking API)
          npm install -g bun 2>/dev/null || true
          ~/.bun/bin/bun tests/tests.js || bun tests/tests.js || true

      - name: Create PR if changed
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/vendor-bump-${{ steps.check.outputs.latest_three }}
          base: dev
          title: "chore(vendor): bump three to ${{ steps.check.outputs.latest_three }}"
          body: |
            Automated vendor bump via weekly `vendor-check` workflow.

            - three: `${{ steps.check.outputs.latest_three }}`

            Changes:
            - `vendor/three/build/three.module.js`
            - `vendor/three/examples/jsm/utils/BufferGeometryUtils.js`
            - `index.html` comment

            Checklist for reviewer:
            - [ ] Check https://github.com/mrdoob/three.js/releases/tag/r${{ steps.check.outputs.latest_three }}
            - [ ] `bun tests/tests.js` 142 passed (3 Playwright fail is pre-existing)
            - [ ] Bump VERSION file (hook does sw.js CACHE_VERSION)
          commit-message: |
            chore(vendor): bump to three ${{ steps.check.outputs.latest_three }}

            Automated by vendor-check workflow

            Checked: versioning [~], i18n [~], docs [~], readme [~], checklist [~], tests [~], welcome [~], prompts [~], xss [~]
          labels: dependencies
