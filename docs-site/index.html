<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeLaClaw Docs</title>
  <meta name="description" content="Documentation for DeLaClaw — a personal command center you own.">
  <link rel="icon" href="https://delaclaw.com/icons/favicon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css">
  <style>
    :root {
      --base-font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --base-font-size: 15px;
      --base-line-height: 1.6;
      --theme-color: #454dc6;
      --link-color: #454dc6;
      --sidebar-width: 260px;
      --sidebar-nav-link-color--active: #454dc6;
      --sidebar-nav-link-border-color--active: #454dc6;
      --code-font-family: 'DM Mono', 'Fira Code', monospace;
      --code-inline-background: #f4f4f8;
      --code-inline-color: #454dc6;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --mono-hue: 230;
        --mono-saturation: 10%;
      }
    }

    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap');

    .sidebar .app-name {
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .markdown-section table {
      display: table;
      width: 100%;
    }

    .markdown-section img {
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }

    .cover-main {
      color: #454dc6;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'DeLaClaw',
      repo: 'https://github.com/AntGro/DeLaClaw',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      search: {
        placeholder: 'Search docs',
        noData: 'No results',
        depth: 3,
      },
      copyCode: {
        buttonText: 'Copy',
        successText: 'Copied',
      },
      pagination: {
        previousText: 'Previous',
        nextText: 'Next',
        crossChapter: true,
      },
      basePath: location.hostname === 'delaclaw.com' ? '/docs-site/' : '/',
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-javascript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-sql.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
</body>
</html>
